name: Validar PHP
on:
  push:
    branches: [codex/banco-portada]
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis PHP 8.4
        run: docker run --rm -v "$PWD:/app" -w /app php:8.4-cli sh -c 'find . -type f -name "*.php" -exec php -l {} \; > /tmp/lint.log; cat /tmp/lint.log; ! grep -E "Errors parsing|Parse error|Fatal error" /tmp/lint.log'
